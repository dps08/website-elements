<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Card Stack - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero-content {
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 9rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            font-size: clamp(1.5rem, 3vw, 3rem);
            color: #999;
        }

        /* Projects Title */
        .projects-title {
            padding: 5rem 2rem;
            text-align: center;
        }

        .projects-title h2 {
            font-size: clamp(2.5rem, 6vw, 6rem);
            font-weight: 700;
        }

        /* Projects Section */
        .projects-section {
            position: relative;
        }

        .project-card {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            transform-origin: center top;
        }

        .card-content {
            max-width: 1200px;
            width: 100%;
        }

        .project-number {
            font-size: 0.875rem;
            color: #999;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
        }

        .project-title {
            font-size: clamp(2.5rem, 6vw, 7rem);
            font-weight: 700;
            margin-bottom: 2rem;
            line-height: 1.1;
        }

        .project-description {
            font-size: clamp(1.25rem, 3vw, 3rem);
            color: #ccc;
            margin-bottom: 3rem;
            max-width: 800px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 4rem;
        }

        .tag {
            padding: 0.75rem 1.5rem;
            background: #fff;
            color: #000;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 500;
        }

        .highlights {
            margin-bottom: 4rem;
        }

        .highlight {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .highlight-dot {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            margin-top: 0.5rem;
            flex-shrink: 0;
        }

        .highlight-text {
            font-size: 1.25rem;
            line-height: 1.6;
        }

        .view-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #fff;
            color: #000;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .view-button:hover {
            transform: scale(1.05);
        }

        .arrow {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .view-button:hover .arrow {
            transform: translateX(0.5rem);
        }

        /* Footer */
        .footer {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .footer p {
            font-size: 3rem;
            color: #333;
        }

        @media (max-width: 768px) {
            .project-card {
                padding: 1.5rem;
            }

            .tag {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }

            .highlight-text {
                font-size: 1rem;
            }

            .view-button {
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-content">
            <h1>Divit Pratap Singh</h1>
            <p>ML Engineer | Building Intelligence</p>
        </div>
    </div>

    <!-- Projects Title -->
    <div class="projects-title">
        <h2>Featured Projects</h2>
    </div>

    <!-- Projects Section -->
    <div class="projects-section" id="projectsSection">
        <!-- Projects will be injected here -->
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>↑ Scroll up to see the stacking</p>
    </div>

    <script>
        const projects = [
            {
                id: 1,
                title: "EMG-Based Muscle Fatigue Detection",
                description: "Real-time muscle fatigue analysis using biosignals",
                tags: ["Python", "PyTorch", "Signal Processing", "ML"],
                highlights: [
                    "Achieved 94% accuracy in fatigue detection",
                    "Real-time processing with <50ms latency",
                    "Published research findings in IEEE conference"
                ],
                bgColor: "#1a0f2e"
            },
            {
                id: 2,
                title: "Multi-Modal AI Video Understanding",
                description: "Advanced video analysis combining vision and language models",
                tags: ["TensorFlow", "Transformers", "Computer Vision", "NLP"],
                highlights: [
                    "Integrated CLIP and GPT models for video comprehension",
                    "Processing 30fps video streams in real-time",
                    "99.2% accuracy on benchmark datasets"
                ],
                bgColor: "#0f1a2e"
            },
            {
                id: 3,
                title: "Full-Stack Live Auction Platform",
                description: "Scalable real-time bidding system with WebSocket integration",
                tags: ["React", "Node.js", "WebSocket", "PostgreSQL", "AWS"],
                highlights: [
                    "Handles 10,000+ concurrent users",
                    "Sub-100ms bid processing latency",
                    "Deployed microservices architecture on AWS"
                ],
                bgColor: "#0f2e1a"
            }
        ];

        // Create project cards
        const projectsSection = document.getElementById('projectsSection');
        const cardHeight = window.innerHeight;
        projectsSection.style.height = `${100 + projects.length * 50}vh`;

        projects.forEach((project, index) => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.style.backgroundColor = project.bgColor;

            card.innerHTML = `
                <div class="card-content">
                    <div class="project-number">
                        PROJECT ${String(index + 1).padStart(2, '0')} / ${String(projects.length).padStart(2, '0')}
                    </div>

                    <h3 class="project-title">${project.title}</h3>

                    <p class="project-description">${project.description}</p>

                    <div class="tags">
                        ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>

                    <div class="highlights">
                        ${project.highlights.map(highlight => `
                            <div class="highlight">
                                <div class="highlight-dot"></div>
                                <p class="highlight-text">${highlight}</p>
                            </div>
                        `).join('')}
                    </div>

                    <button class="view-button">
                        View Project
                        <span class="arrow">→</span>
                    </button>
                </div>
            `;

            projectsSection.appendChild(card);
        });

        // Handle scroll animations
        const cards = document.querySelectorAll('.project-card');

        function handleScroll() {
            const sectionTop = projectsSection.offsetTop;
            const scrollY = window.scrollY;
            const relativeScroll = scrollY - sectionTop;

            cards.forEach((card, index) => {
                const cardStart = index * cardHeight * 0.5;
                const progress = Math.max(0, Math.min(1, (relativeScroll - cardStart) / (cardHeight * 0.5)));

                const scale = 1 - (progress * 0.05);
                const opacity = 1 - (progress * 0.5);

                card.style.transform = `scale(${scale})`;
                card.style.opacity = opacity;
            });
        }

        window.addEventListener('scroll', handleScroll);
        handleScroll(); // Initial call

        // Add click handlers to buttons
        document.querySelectorAll('.view-button').forEach((button, index) => {
            button.addEventListener('click', () => {
                alert(`Opening project: ${projects[index].title}`);
            });
        });
    </script>
</body>
</html>
