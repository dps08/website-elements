<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Cosmos Sphere</title>
    <link rel="stylesheet" href="cosmos-sphere.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">Explore the Cosmos</h1>
            <p class="subtitle">Drag to rotate • Scroll to zoom • Experience the universe</p>
        </div>

        <canvas id="cosmos-canvas"></canvas>

        <div class="info-panel">
            <h2>Interactive Cosmos Sphere</h2>
            <p>This Three.js element features:</p>
            <ul>
                <li>360° mouse rotation control</li>
                <li>Smooth scroll-based zoom</li>
                <li>Dynamic particle system</li>
                <li>Realistic cosmic rendering</li>
            </ul>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="cosmos-sphere.js"></script>
</body>
</html>
